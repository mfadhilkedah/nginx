server {
    listen 80;

    # Benarkan saiz payload yang besar
    client_max_body_size 100M;

    # Wajib: Elakkan ralat header/cookie overflow di Render
    client_header_buffer_size 16k;
    large_client_header_buffers 4 64k;

    location / {
        proxy_pass http://136.119.197.135:80;

        # Keepalive dan HTTP 1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Header yang dihantar ke VM GCP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Timeout 300 saat
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # PENYELESAIAN 502: Penimbal respons besar untuk menampung Set-Cookie Laravel
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
